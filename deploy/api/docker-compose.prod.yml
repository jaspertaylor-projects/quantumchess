# Production compose for the API box (one small EC2/Lightsail instance).
# Run from this directory:  docker compose -f docker-compose.prod.yml up -d
#
# IMPORTANT: exactly ONE backend instance. Matchmaking and live-game state
# are in-memory; horizontal scaling would need shared state (Redis) first.

services:
  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_DIR=/logs
      # Error-alert emails (optional; alerting is off unless USER/PASS/TO are
      # all set). Uses the qc-ses-smtp credentials. Put real values in ./.env
      # next to this file — compose reads it automatically; never commit them.
      - QC_ALERT_SMTP_USER=${QC_ALERT_SMTP_USER:-}
      - QC_ALERT_SMTP_PASS=${QC_ALERT_SMTP_PASS:-}
      - QC_ALERT_TO=${QC_ALERT_TO:-}
      - QC_ALERT_FROM=${QC_ALERT_FROM:-noreply@quantumchess.ninja}
      # Admin stats persistence (optional; stats writes are off unless both are
      # set). URL is the Supabase project URL (https://<ref>.supabase.co); the
      # key is the SERVICE ROLE key (Dashboard -> Settings -> API) — it bypasses
      # RLS, so it lives only in ./.env on this box, never in the repo or the
      # frontend.
      - QC_SUPABASE_URL=${QC_SUPABASE_URL:-}
      - QC_SUPABASE_SERVICE_KEY=${QC_SUPABASE_SERVICE_KEY:-}
    volumes:
      - api_logs:/logs
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  api_logs:
  caddy_data:
  caddy_config:
