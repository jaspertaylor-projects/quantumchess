    <style>
      /* Critical pre-app rules, inlined so they apply at the very first paint
         (before the bundle or its CSS arrive): #root must already
         hold the full viewport, otherwise it collapses to 0 height and the
         below-the-fold section flashes at the top while the app loads.
         App.css repeats these once it loads. */
      html, body {
        margin: 0; height: 100%; background: #0a0e1a;
        overscroll-behavior-y: none;
      }
      html { scroll-snap-type: y proximity; }
      #root {
        height: 100vh; height: 100dvh; overflow: hidden;
        scroll-snap-align: start; scroll-snap-stop: always;
      }
      .qc-welcome-static {
        box-sizing: border-box; height: 100%; overflow: auto; color: #edf5ff;
        padding: clamp(38px, 7vh, 76px) clamp(20px, 6vw, 88px) 56px;
        background:
          radial-gradient(circle at 78% 22%, rgba(113, 89, 255, .22), transparent 32%),
          radial-gradient(circle at 18% 18%, rgba(39, 197, 255, .15), transparent 30%),
          #080c18;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      .qc-welcome-static a { color: inherit; text-decoration: none; }
      .qc-welcome-static h1 { margin: 0; text-align: center; font-size: clamp(2.1rem, 4.6vw, 3.625rem); line-height: 1; letter-spacing: -.045em; }
      .qc-welcome-static h1 span { color: #71d9ff; }
      .qc-welcome-static-tagline { margin: 9px 0 clamp(28px, 4vh, 40px); color: #7f8aa1; text-align: center; font-size: clamp(.65rem, 1.05vw, .8rem); letter-spacing: .035em; }
      .qc-welcome-static-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; max-width: 1060px; margin: 0 auto; }
      .qc-welcome-static-card { display: block; padding: 20px; border: 1px solid rgba(143, 214, 255, .25); border-radius: 18px; background: rgba(18, 25, 45, .84); }
      .qc-welcome-static-card strong { display: block; margin-bottom: 8px; font-size: 1.12rem; }
      .qc-welcome-static-card span { color: #aebbd0; line-height: 1.5; }
      .qc-welcome-static-orbit { width: min(48vh, 440px, 82vw); aspect-ratio: 1; margin: 42px auto 0; border: 1px solid rgba(103,232,249,.22); border-radius: 50%; box-shadow: inset 0 0 90px rgba(103,232,249,.08), 0 0 50px rgba(103,232,249,.08); }
      .qc-welcome-static-links { margin-top: 24px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 24px; }
      .qc-welcome-static-links a { color: #667187; font-size: .65rem; letter-spacing: .045em; }
      @media (max-width: 720px) {
        .qc-welcome-static-choices { grid-template-columns: 1fr; }
      }

      /* Static below-the-fold content (crawlable; the game itself fills the
         first viewport, so players landing here never see this unless they
         scroll). Styled here because the app bundle doesn't know about it. */
    </style>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Disable zoom across browsers and devices
      (function disableZoomGlobally() {
        const prevent = (e) => { e.preventDefault(); };

        // Prevent pinch-zoom on Safari/iOS and some webkit variants
        ['gesturestart', 'gesturechange', 'gestureend'].forEach((evt) => {
          document.addEventListener(evt, prevent, { passive: false });
        });

        // Block Ctrl/Cmd + +/-/0 zoom keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey || e.metaKey) {
            const k = e.key;
            if (k === '+' || k === '=' || k === '-' || k === '0') {
              e.preventDefault();
            }
          }
        }, { passive: false });

        // Block Ctrl/Cmd + mouse wheel zooming
        document.addEventListener('wheel', (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // Reduce double-tap-to-zoom on mobile
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
  </body>
</html>
