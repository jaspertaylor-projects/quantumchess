<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, follow" />
<title>Page Lost in Superposition — Quantum Chess</title>
<meta name="description" content="This Quantum Chess page collapsed out of existence. Return to the game, read the rules, or explore the strategy guide." />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root {
    color-scheme: dark;
    --cyan: #75e5ff;
    --violet: #bc8cff;
    --ink: #050914;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    padding: clamp(18px, 4vw, 42px);
    background:
      radial-gradient(circle at 18% 18%, rgba(77, 98, 255, .22), transparent 28rem),
      radial-gradient(circle at 82% 78%, rgba(0, 229, 255, .13), transparent 25rem),
      var(--ink);
    color: #edf8ff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .32;
    background-image: radial-gradient(circle, rgba(164, 227, 255, .8) 0 1px, transparent 1.5px);
    background-size: 46px 46px;
    mask-image: linear-gradient(to bottom, black, transparent 82%);
  }
  main {
    position: relative;
    z-index: 1;
    width: min(940px, 100%);
    display: grid;
    grid-template-columns: minmax(260px, .9fr) minmax(280px, 1.1fr);
    align-items: center;
    gap: clamp(24px, 6vw, 70px);
  }
  .copy { text-align: left; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--cyan);
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    font-size: .76rem;
  }
  .eyebrow::before {
    content: "";
    width: 22px;
    height: 2px;
    background: currentColor;
    box-shadow: 0 0 12px currentColor;
  }
  .code {
    margin: 0;
    color: transparent;
    font-size: clamp(5rem, 15vw, 9rem);
    font-weight: 950;
    line-height: .8;
    letter-spacing: -.08em;
    -webkit-text-stroke: 1px rgba(117, 229, 255, .8);
    background: linear-gradient(135deg, #f5fdff 5%, var(--cyan) 45%, var(--violet));
    background-clip: text;
    filter: drop-shadow(0 0 26px rgba(81, 214, 255, .22));
  }
  h1 {
    margin: 22px 0 10px;
    max-width: 520px;
    font-size: clamp(1.65rem, 4vw, 2.55rem);
    line-height: 1.08;
  }
  .message {
    margin: 0 0 24px;
    max-width: 500px;
    color: #aebfd2;
    line-height: 1.7;
  }
  nav { display: flex; flex-wrap: wrap; gap: 10px; }
  a, button {
    min-height: 44px;
    padding: 11px 16px;
    border: 1px solid rgba(117, 229, 255, .38);
    border-radius: 10px;
    color: #9feaff;
    background: rgba(9, 19, 38, .72);
    font: inherit;
    font-weight: 780;
    text-decoration: none;
    cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  a:first-child {
    border-color: transparent;
    background: linear-gradient(135deg, var(--cyan), #72a4ff);
    color: #04101c;
  }
  a:hover, a:focus-visible, button:hover, button:focus-visible {
    transform: translateY(-2px);
    border-color: var(--cyan);
    outline: none;
  }
  .experiment {
    display: grid;
    justify-items: center;
    gap: 16px;
  }
  .board-shell {
    position: relative;
    width: min(100%, 430px);
    aspect-ratio: 1;
    padding: 10px;
    border: 1px solid rgba(117, 229, 255, .26);
    border-radius: 22px;
    background: rgba(10, 19, 36, .7);
    box-shadow: 0 24px 80px rgba(0, 0, 0, .45), 0 0 45px rgba(74, 192, 255, .08);
    transform: rotate(1deg);
  }
  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 14px;
    background: #101b31;
  }
  .square:nth-child(8n + 1), .square:nth-child(8n + 3),
  .square:nth-child(8n + 6), .square:nth-child(8n + 8) { background: rgba(110, 197, 255, .12); }
  .piece {
    position: absolute;
    left: calc((var(--file) + .5) * 25%);
    top: calc((var(--rank) + .5) * 25%);
    display: grid;
    place-items: center;
    width: 21%;
    aspect-ratio: 1;
    color: white;
    font-family: Georgia, serif;
    font-size: clamp(2.8rem, 8vw, 5.4rem);
    line-height: 1;
    text-shadow: 0 0 5px #fff, 0 0 18px var(--cyan), 0 0 34px #597cff;
    transform: translate(-50%, -50%);
    transition: left .65s cubic-bezier(.2, .8, .2, 1), top .65s cubic-bezier(.2, .8, .2, 1);
    z-index: 3;
  }
  .piece::before, .piece::after {
    content: "♞";
    position: absolute;
    opacity: .25;
    filter: blur(.3px);
    animation: phase 2.2s ease-in-out infinite;
  }
  .piece::before { color: var(--cyan); transform: translate(-10px, 3px); }
  .piece::after { color: var(--violet); transform: translate(10px, -3px); animation-delay: -1.1s; }
  .piece.collapsing { animation: collapse .65s ease; }
  .spark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px currentColor;
    opacity: 0;
    pointer-events: none;
  }
  .board.is-collapsing .spark {
    animation: spark .7s ease-out var(--delay) both;
  }
  .readout {
    min-height: 1.5em;
    margin: 0;
    color: #b8c9da;
    text-align: center;
    font-size: .9rem;
  }
  .readout strong { color: var(--cyan); }
  button { padding-inline: 18px; }
  @keyframes phase {
    0%, 100% { opacity: .15; }
    50% { opacity: .42; }
  }
  @keyframes collapse {
    0%, 100% { scale: 1; filter: none; }
    45% { scale: .55; filter: brightness(3); }
    70% { scale: 1.16; }
  }
  @keyframes spark {
    0% { opacity: 1; transform: rotate(var(--angle)) translateX(0) scale(1.5); }
    100% { opacity: 0; transform: rotate(var(--angle)) translateX(var(--distance)) scale(0); }
  }
  @media (max-width: 720px) {
    body { align-items: start; }
    main { grid-template-columns: 1fr; gap: 28px; }
    .copy { text-align: center; }
    h1, .message { margin-left: auto; margin-right: auto; }
    nav { justify-content: center; }
    .board-shell { width: min(84vw, 350px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main>
  <section class="copy">
    <div class="eyebrow">Position not found</div>
    <p class="code" aria-label="Error 404">404</p>
    <h1>This page is in another universe.</h1>
    <p class="message">You found a branch of reality where this URL never existed. Fortunately, the rest of Quantum Chess survived the measurement.</p>
    <nav aria-label="Useful destinations">
      <a href="/">Return to Quantum Chess</a>
      <a href="/rules.html">Read the rules</a>
      <a href="/strategy.html">Strategy guide</a>
    </nav>
  </section>

  <section class="experiment" aria-label="Interactive quantum chess experiment">
    <div class="board-shell">
      <div class="board" id="board" aria-hidden="true">
        <span class="piece" id="piece" style="--file: 1; --rank: 1">♞</span>
      </div>
    </div>
    <button type="button" id="collapse">Collapse another possibility</button>
    <p class="readout" id="readout" aria-live="polite">Knight status: <strong>probably here</strong></p>
  </section>
</main>
<script>
  const board = document.getElementById('board');
  const piece = document.getElementById('piece');
  const button = document.getElementById('collapse');
  const readout = document.getElementById('readout');
  const files = ['a', 'b', 'c', 'd'];
  let previous = 5;

  for (let i = 0; i < 16; i += 1) {
    const square = document.createElement('span');
    square.className = 'square';
    board.appendChild(square);
  }
  for (let i = 0; i < 18; i += 1) {
    const spark = document.createElement('i');
    spark.className = 'spark';
    spark.style.setProperty('--angle', `${i * 20}deg`);
    spark.style.setProperty('--distance', `${90 + (i % 4) * 18}px`);
    spark.style.setProperty('--delay', `${(i % 3) * 35}ms`);
    board.appendChild(spark);
  }

  button.addEventListener('click', () => {
    let next;
    do next = Math.floor(Math.random() * 16); while (next === previous);
    previous = next;
    piece.style.setProperty('--file', next % 4);
    piece.style.setProperty('--rank', Math.floor(next / 4));
    piece.classList.remove('collapsing');
    board.classList.remove('is-collapsing');
    void board.offsetWidth;
    piece.classList.add('collapsing');
    board.classList.add('is-collapsing');
    readout.innerHTML = `Knight collapsed on <strong>${files[next % 4]}${4 - Math.floor(next / 4)}</strong>. The page is still missing.`;
  });
</script>
</body>
</html>
