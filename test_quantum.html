<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a2e; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
.piece-test { 
  width: 150px; height: 150px; 
  border: 1px solid #444;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.piece-test img { width: 140px; height: 140px; }
.piece-test span { color: white; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="piece-test"><img src="frontend/src/assets/quantum_p.svg"><span>Pawn (0°)</span></div>
<div class="piece-test"><img src="frontend/src/assets/quantum_n.svg"><span>Knight (60°)</span></div>
<div class="piece-test"><img src="frontend/src/assets/quantum_q.svg"><span>Queen (120°)</span></div>
<div class="piece-test"><img src="frontend/src/assets/quantum_k.svg"><span>King (180°)</span></div>
<div class="piece-test"><img src="frontend/src/assets/quantum_r.svg"><span>Rook (240°)</span></div>
<div class="piece-test"><img src="frontend/src/assets/quantum_b.svg"><span>Bishop (300°)</span></div>

<h2 style="color:white;width:100%">All 6 overlaid (as they'd appear in a quantum piece):</h2>
<div style="position:relative; width:200px; height:200px; border:1px solid #666">
  <img src="frontend/src/assets/quantum_p.svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.95">
  <img src="frontend/src/assets/quantum_n.svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.95">
  <img src="frontend/src/assets/quantum_q.svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.95">
  <img src="frontend/src/assets/quantum_k.svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.95">
  <img src="frontend/src/assets/quantum_r.svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.95">
  <img src="frontend/src/assets/quantum_b.svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.95">
</div>
</body>
</html>
